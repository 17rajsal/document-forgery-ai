name: Proofly Investor CI

on:
  push:
    branches: [ main, feature/proofly-ai-backend ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install System Dependencies (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Build React Frontend
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Run Proofly Investor Safety Tests
        run: |
          python -m unittest tests/test_investor_safety.py -v

      - name: Run Proofly Intelligence API Tests
        run: |
          python backend/test_intelligence.py

      - name: Run Core Multimodal Forensic Tests
        run: |
          python -m unittest tests/test_proofly.py -v

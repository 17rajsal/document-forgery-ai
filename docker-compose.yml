version: '3.8'

services:
  document-forgery-ai:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: document-forgery-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/backend/uploads
    environment:
      - PORT=8000
      - TESSERACT_CMD=/usr/bin/tesseract
